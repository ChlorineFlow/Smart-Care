name: SmartCare CI and CD handoff

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartcare-main
  cancel-in-progress: false

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartcare
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: smartcare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartcare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:smartcare_ci@127.0.0.1:5432/smartcare
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: smartcare
      DB_USER: postgres
      DB_PASSWORD: smartcare_ci
      DB_SSL: "false"
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize disposable test database
        run: npm run db:schema

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Start API and run health test
        shell: bash
        run: |
          set -euo pipefail
          npm run server > /tmp/smartcare-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/api/health >/dev/null; then
              npm test
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/smartcare-api.log
              exit 1
            fi
            sleep 2
          done

          cat /tmp/smartcare-api.log
          echo "API did not become healthy in time." >&2
          exit 1

  sonar:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4

      - name: Scan and enforce Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  trigger-jenkins:
    name: Start EC2 and trigger private Jenkins CD
    runs-on: ubuntu-latest
    needs: [verify, sonar]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      EC2_NAME: smartcare-devops-server
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Validate requested SHA
        shell: bash
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full 40-character commit SHA." >&2
            exit 1
          fi
          if [[ "$COMMIT_SHA" != "$GITHUB_SHA" && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "The deployment SHA must match the commit that passed this workflow." >&2
            exit 1
          fi

      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start EC2 if stopped and wait for SSM
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=$EC2_NAME" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          if [[ -z "$instance_id" || "$instance_id" == None ]]; then
            echo "No EC2 instance found with Name=$EC2_NAME." >&2
            exit 1
          fi
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

          state="$(aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$instance_id" --query 'Reservations[0].Instances[0].State.Name' --output text)"
          if [[ "$state" == stopped ]]; then
            aws ec2 start-instances --region "$AWS_REGION" --instance-ids "$instance_id" >/dev/null
          elif [[ "$state" == stopping ]]; then
            aws ec2 wait instance-stopped --region "$AWS_REGION" --instance-ids "$instance_id"
            aws ec2 start-instances --region "$AWS_REGION" --instance-ids "$instance_id" >/dev/null
          elif [[ "$state" != running && "$state" != pending ]]; then
            echo "EC2 is in unsupported state: $state" >&2
            exit 1
          fi

          aws ec2 wait instance-status-ok --region "$AWS_REGION" --instance-ids "$instance_id"
          for attempt in $(seq 1 60); do
            ping="$(aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$instance_id" \
              --query 'InstanceInformationList[0].PingStatus' --output text)"
            if [[ "$ping" == Online ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "EC2 did not register as an online SSM managed instance." >&2
          exit 1

      - name: Trigger Jenkins for this exact commit and wait for CD
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name SmartCare-Trigger-Jenkins \
            --parameters "CommitSha=$COMMIT_SHA" \
            --comment "GitHub Actions CI and SonarCloud passed for $COMMIT_SHA" \
            --query 'Command.CommandId' --output text)"

          for attempt in $(seq 1 360); do
            invocation="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null || true)"
            status="$(jq -r '.Status // "Pending"' <<<"$invocation")"
            case "$status" in
              Success)
                jq -r '.StandardOutputContent // "Jenkins deployment succeeded."' <<<"$invocation"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                jq -r '.StandardErrorContent // .StandardOutputContent // "SSM/Jenkins command failed."' <<<"$invocation" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Jenkins CD command $command_id." >&2
          exit 1
