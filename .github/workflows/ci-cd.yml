name: SmartCare CI/CD

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartcare-main
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, build, and API test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartcare
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: smartcare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smartcare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:smartcare_ci@127.0.0.1:5432/smartcare
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: smartcare
      DB_USER: postgres
      DB_PASSWORD: smartcare_ci
      DB_SSL: "false"
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database
        run: npm run db:schema

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Start API and run health test
        shell: bash
        run: |
          set -euo pipefail
          npm run server > /tmp/smartcare-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/api/health >/dev/null; then
              npm test
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/smartcare-api.log
              exit 1
            fi
            sleep 2
          done

          cat /tmp/smartcare-api.log
          echo "API did not become healthy in time." >&2
          exit 1

  sonar:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    outputs:
      passed: ${{ steps.token-check.outputs.configured }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check SonarCloud token
        id: token-check
        shell: bash
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is not configured; quality gate and deployment are skipped." >&2
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@v5
        if: steps.token-check.outputs.configured == 'true'
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  publish:
    name: Build and publish container images
    runs-on: ubuntu-latest
    needs: [verify, sonar]
    if: github.ref == 'refs/heads/main' && needs.sonar.outputs.passed == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/chlorineflow/smart-care-backend:sha-${{ github.sha }}
            ghcr.io/chlorineflow/smart-care-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/chlorineflow/smart-care-frontend:sha-${{ github.sha }}
            ghcr.io/chlorineflow/smart-care-frontend:latest

  deploy:
    name: Deploy to EC2 K3s when online
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      EC2_NAME: smartcare-devops-server
      IMAGE_TAG: sha-${{ github.sha }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Check AWS deploy role
        id: role-check
        shell: bash
        run: |
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_DEPLOY_ROLE_ARN is not configured; images are published but deployment is skipped." >&2
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        if: steps.role-check.outputs.configured == 'true'
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy over Systems Manager when EC2 is running
        shell: bash
        if: steps.role-check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=$EC2_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)"

          if [[ -z "$instance_id" || "$instance_id" == "None" ]]; then
            echo "EC2 is stopped. Images are published; smartcare-cloud.bat will deploy latest when the instance starts."
            exit 0
          fi

          parameters="$(jq -n --arg tag "$IMAGE_TAG" --arg sha "$GITHUB_SHA" '{commands:[
            "set -eu",
            "sudo systemctl start docker k3s",
            "sudo install -d -o ubuntu -g ubuntu /opt/smartcare-deploy",
            "if [ ! -d /opt/smartcare-deploy/.git ]; then sudo -u ubuntu git clone --depth 1 --branch main https://github.com/ChlorineFlow/Smart-Care.git /opt/smartcare-deploy; fi",
            ("sudo -u ubuntu git -C /opt/smartcare-deploy fetch --depth=1 origin " + $sha),
            ("sudo -u ubuntu git -C /opt/smartcare-deploy checkout --detach " + $sha),
            ("sudo bash /opt/smartcare-deploy/scripts/deploy-k3s.sh " + $tag)
          ]}')"

          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment "SmartCare deploy $GITHUB_SHA" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          if ! aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance_id"; then
            aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance_id" --query 'StandardErrorContent' --output text
            exit 1
          fi
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance_id" --query 'StandardOutputContent' --output text
