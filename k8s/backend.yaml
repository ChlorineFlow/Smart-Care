apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcare-backend
  namespace: smartcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartcare-backend
  template:
    metadata:
      labels:
        app: smartcare-backend
    spec:
      containers:
        - name: smartcare-backend
          image: ghcr.io/chlorineflow/smart-care-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: smartcare-app-env
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smartcare-backend
  namespace: smartcare
spec:
  type: ClusterIP
  selector:
    app: smartcare-backend
  ports:
    - name: http
      port: 4000
      targetPort: http