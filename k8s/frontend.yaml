apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcare-frontend
  namespace: smartcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartcare-frontend
  template:
    metadata:
      labels:
        app: smartcare-frontend
    spec:
      containers:
        - name: smartcare-frontend
          image: ghcr.io/chlorineflow/smart-care-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smartcare-frontend
  namespace: smartcare
spec:
  type: LoadBalancer
  selector:
    app: smartcare-frontend
  ports:
    - name: http
      port: 80
      targetPort: http