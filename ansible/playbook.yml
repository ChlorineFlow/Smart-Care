---
- name: Configure SmartCare DevOps Server
  hosts: smartcare
  become: true

  tasks:

    - name: Install host tools required for SSM to Jenkins handoff
      ansible.builtin.package:
        name:
          - curl
          - jq
        state: present

    - name: Ensure Docker starts with the instance
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Ensure Jenkins starts with the instance
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started

    - name: Install private Jenkins trigger helper
      ansible.builtin.copy:
        src: files/smartcare-trigger-jenkins.sh
        dest: /usr/local/sbin/smartcare-trigger-jenkins
        owner: root
        group: root
        mode: "0750"

    - name: Check that the root-only Jenkins trigger configuration exists
      ansible.builtin.stat:
        path: /etc/smartcare/jenkins-trigger.env
      register: jenkins_trigger_config

    - name: Require the Jenkins trigger configuration
      ansible.builtin.assert:
        that:
          - jenkins_trigger_config.stat.exists
          - jenkins_trigger_config.stat.pw_name == "root"
          - jenkins_trigger_config.stat.mode == "0600"
        fail_msg: Create /etc/smartcare/jenkins-trigger.env owned by root with mode 0600 before applying this playbook.

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Verify Docker is usable by the Jenkins execution account
      become_user: jenkins
      ansible.builtin.command:
        cmd: docker info
      register: jenkins_docker_info
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"

    - name: Check Node.js version
      ansible.builtin.command:
        cmd: node --version
      register: node_version
      changed_when: false

    - name: Display Node.js version
      ansible.builtin.debug:
        msg: "{{ node_version.stdout }}"

    - name: Ensure K3s is enabled and running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Check K3s service
      ansible.builtin.command:
        cmd: systemctl is-active k3s
      register: k3s_status
      changed_when: false

    - name: Display K3s status
      ansible.builtin.debug:
        msg: "K3s status: {{ k3s_status.stdout }}"

    - name: Check Jenkins service
      ansible.builtin.command:
        cmd: systemctl is-active jenkins
      register: jenkins_status
      changed_when: false

    - name: Display Jenkins status
      ansible.builtin.debug:
        msg: "Jenkins status: {{ jenkins_status.stdout }}"

    - name: Check SmartCare Kubernetes pods
      ansible.builtin.command:
        cmd: kubectl get pods -n smartcare
      register: smartcare_pods
      changed_when: false

    - name: Display SmartCare pods
      ansible.builtin.debug:
        msg: "{{ smartcare_pods.stdout }}"
